#--------------------------------------------------------------------


#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro _NOTIFY_PAUSE]
gcode:
  {action_call_remote_method("notify",
                             name="print_paused",
                             message="Print paused: %s" % printer.print_stats.filename)}

# Pause and resume hooks; every other Fluidd client setting keeps its default.


#####################################################################
#   Heat soak
#####################################################################
# The print heat soak runs on a timer while the print is PAUSED, so
# CANCEL works at any point during bed heating and the soak.
# SKIP_SOAK ends the soak early and continues the print.
# HEAT_SOAK / STOP_HEAT_SOAK are for manual pre-heating outside a print.

[gcode_macro _HEAT_SOAK_VARIABLES]
# Manual soak (HEAT_SOAK)
variable_time_remaining: 0
variable_manual_soak_active: 0  # 1 = manual soak in progress
variable_manual_bed_target: 0
variable_manual_bed_ready: 0
# Print soak (PRINT_START)
variable_print_soak_active: 0   # 1 = print is paused for a heat soak
variable_bed_target: 0
variable_bed_ready: 0           # 1 = bed reached temp, soak clock running
variable_target: 0              # Chamber target (C)
variable_min_s: 0
variable_max_s: 0
variable_elapsed: 0             # Seconds into the current print soak
variable_last_temp: -100.0      # Chamber temp at the last 1-minute sample
variable_stable_count: 0        # Consecutive minutes with < 0.3C rise
gcode:

[gcode_macro HEAT_SOAK]
description: Pre-heat the bed and run a timed heat soak (outside a print). STOP_HEAT_SOAK to end it.
gcode:
  {% set TARGET = params.TARGET | default(100) | int %}
  {% set DURATION = params.DURATION | default(15) | int %}

  # Kill any cooldown timers if they were running
  UPDATE_DELAYED_GCODE ID=cooldown_bed_timer DURATION=0

  {action_respond_info("Manual heat soak: heating bed to %dC, then soaking %d min. STOP_HEAT_SOAK to end." % (TARGET, DURATION))}
  M140 S{TARGET} # Heat asynchronously; the timer waits for the bed

  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE={DURATION}
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_target VALUE={TARGET}
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=1
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=1

[gcode_macro STOP_HEAT_SOAK]
description: Stop a manual heat soak. BED_OFF=1 (default) also turns the bed off.
gcode:
  {% set BED_OFF = params.BED_OFF | default(1) | int %}
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE=0
  {% if BED_OFF == 1 %}
    M140 S0
  {% endif %}
  {action_respond_info("Manual heat soak stopped.")}

[delayed_gcode heat_soak_timer]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.manual_soak_active == 1 %}
    {% if v.manual_bed_ready == 0 %}
      {% if printer.heater_bed.temperature >= v.manual_bed_target - 1 %}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_ready VALUE=1
        {action_respond_info("Bed at temperature. Starting %d minute manual heat soak countdown..." % v.time_remaining)}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=60
      {% else %}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=5
      {% endif %}
    {% else %}
      {% set remaining = v.time_remaining | int - 1 %}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE={remaining}
      {% if remaining > 0 %}
        {action_respond_info("Heat soaking... %d minutes remaining." % remaining)}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=60
      {% else %}
        {action_respond_info("Manual heat soak complete! Bed will stay hot until you start a print.")}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
      {% endif %}
    {% endif %}
  {% endif %}

# One step of the print heat soak. While the bed is heating it checks every
# 5 s; once the bed is at temp it runs once a minute.
[delayed_gcode print_soak_timer]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.print_soak_active == 1 %}
    {% set chamber = printer["temperature_sensor chamber"].temperature | float %}

    {% if v.bed_ready == 0 %}
      {% if printer.heater_bed.temperature >= v.bed_target - 1 %}
        {action_respond_info("Bed at %dC. Heat soaking to %.0fC chamber (min %d, max %d min)..." % (v.bed_target, v.target, v.min_s // 60, v.max_s // 60))}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=bed_ready VALUE=1
        M117 Heat soaking
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=1
      {% else %}
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=5
      {% endif %}

    {% else %}
      {% set elapsed = v.elapsed | int %}
      # Once a minute, check whether the chamber has stopped rising
      {% set stable = v.stable_count + 1 if chamber - v.last_temp < 0.3 else 0 %}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=last_temp VALUE={chamber}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=stable_count VALUE={stable}

      {% if elapsed >= v.max_s %}
        {action_respond_info("Heat soak hit the %d min limit (chamber %.1fC). Continuing." % (v.max_s // 60, chamber))}
        _FINISH_PRINT_SOAK
      {% elif elapsed >= v.min_s and chamber >= v.target %}
        {action_respond_info("Chamber reached %.1fC after %d min. Heat soak complete." % (chamber, elapsed // 60))}
        _FINISH_PRINT_SOAK
      {% elif elapsed >= v.min_s and stable >= 3 %}
        {action_respond_info("Chamber leveled off at %.1fC after %d min. Heat soak complete." % (chamber, elapsed // 60))}
        _FINISH_PRINT_SOAK
      {% else %}
        {action_respond_info("Heat soaking: %d min, chamber %.1f / %.0fC" % (elapsed // 60, chamber, v.target))}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=elapsed VALUE={elapsed + 60}
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=60
      {% endif %}
    {% endif %}
  {% endif %}

# Ends the print soak: runs the pre-print sequence, then resumes the paused print.
[gcode_macro _FINISH_PRINT_SOAK]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0
  M190 S{v.bed_target}   ; Instant if the bed is already at temp (matters for SKIP_SOAK)
  _START_PRINT_POST_SOAK
  # Re-save the pause state at the current (post-homing) position so that
  # RESUME_BASE doesn't try to move back to where the toolhead was before homing.
  SAVE_GCODE_STATE NAME=PAUSE_STATE
  RESUME_BASE

[gcode_macro SKIP_SOAK]
description: End the current print heat soak early and continue the print
gcode:
  {% if printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Skipping the rest of the heat soak.")}
    _FINISH_PRINT_SOAK
  {% else %}
    {action_respond_info("No print heat soak is running.")}
  {% endif %}

# Fluidd's RESUME button runs this just before it resumes. If a soak is in
# progress, it does the same as SKIP_SOAK's pre-print sequence so the print
# never resumes un-homed / un-leveled.
[gcode_macro _SOAK_RESUME_GUARD]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.print_soak_active == 1 %}
    {action_respond_info("Resume pressed during heat soak: skipping the rest of the soak.")}
    UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0
    M190 S{v.bed_target}
    _START_PRINT_POST_SOAK
    SAVE_GCODE_STATE NAME=PAUSE_STATE
  {% endif %}

# Fluidd client hooks; every other Fluidd client setting keeps its default.
# runout_sensor makes Fluidd's RESUME refuse to resume while no filament is detected.
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro: "_NOTIFY_PAUSE"
variable_user_resume_macro: "_SOAK_RESUME_GUARD"
variable_runout_sensor: "filament_switch_sensor T0_filament"
gcode:

[delayed_gcode cooldown_bed_timer]
gcode:
    {action_respond_info("1 hour has passed since print completed. Turning off bed heater.")}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0

#####################################################################
#   Filament: Orbiter sensor auto-load, unload button, runout
#####################################################################
# Hardware sections ([filament_switch_sensor T0_filament], [gcode_button T0_unload])
# live in toolchanger/tools/T0.cfg. Lengths below are for an Orbiter 2.5 + CHCB-V;
# tune them if loads stop short of the nozzle or unloads don't clear the gears.
# The toolhead is never moved by these macros (your hand may be on it).

[gcode_macro _FILAMENT_VARIABLES]
variable_load_temp: 240        # Hotend temp for loading/unloading when the nozzle is cold
variable_grab_length: 15       # Cold feed to bite the filament (FORCE_MOVE, no heat needed)
variable_load_length: 45       # Gears -> melt zone
variable_purge_length: 20      # Extruded through the nozzle after loading
variable_tip_push: 5           # Unload: push to soften the tip
variable_tip_pull: 15          # Unload: quick pull to break the tip off cleanly
variable_unload_length: 80     # Unload: total slow pull to clear the gears
gcode:

# Klipper rejects single extrude-only moves over 50mm, so long moves are split.
[gcode_macro _EXTRUDE_SPLIT]
gcode:
  {% set dist = params.E | float %}
  {% set f = params.F | default(600) | float %}
  {% set n = ((dist | abs) / 45) | round(0, 'ceil') | int %}
  {% set n = [n, 1] | max %}
  {% for i in range(n) %}
    G1 E{dist / n} F{f}
  {% endfor %}

[gcode_macro LOAD_FILAMENT]
description: Grab, heat, load and purge filament on the active tool. [TEMP=] [PURGE=]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set ext = printer.toolhead.extruder %}
  {% set prev_target = printer[ext].target | float %}
  {% set temp = params.TEMP | default([prev_target, fv.load_temp] | max) | float %}
  {% set purge = params.PURGE | default(fv.purge_length) | float %}
  {% set grab = params.GRAB | default(1) | int %}
  {% set state = printer.print_stats.state %}

  {% if state == "printing" %}
    {action_respond_info("LOAD_FILAMENT: not allowed while printing.")}
  {% else %}
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    {% if grab == 1 %}
      M117 Grabbing filament
      FORCE_MOVE STEPPER={ext} DISTANCE={fv.grab_length} VELOCITY=5
    {% endif %}
    M117 Heating to {temp|int}C to load
    M109 S{temp}
    M117 Loading filament
    M83
    _EXTRUDE_SPLIT E={fv.load_length} F=600
    G1 E{purge} F150
    G1 E-1 F1800        ; small retract to limit ooze
    M400
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    {% if state != "paused" %}
      SET_HEATER_TEMPERATURE HEATER={ext} TARGET={prev_target}
    {% endif %}
    M117 Filament loaded
    RESPOND MSG="Filament loaded."
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat (if needed), form a clean tip and pull the filament out of the active tool. [TEMP=]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set ext = printer.toolhead.extruder %}
  {% set prev_target = printer[ext].target | float %}
  {% set temp = params.TEMP | default([prev_target, fv.load_temp] | max) | float %}
  {% set state = printer.print_stats.state %}

  {% if state == "printing" %}
    {action_respond_info("UNLOAD_FILAMENT: not allowed while printing.")}
  {% else %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    M117 Heating to {temp|int}C to unload
    M109 S{temp}
    M117 Unloading filament
    M83
    G1 E{fv.tip_push} F300
    G1 E-{fv.tip_pull} F3000
    G4 P2000
    _EXTRUDE_SPLIT E=-{fv.unload_length} F=1200
    M400
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    {% if state != "paused" %}
      SET_HEATER_TEMPERATURE HEATER={ext} TARGET={prev_target}
    {% endif %}
    M117 Filament unloaded
    RESPOND MSG="Filament unloaded. Pull it out of the sensor."
  {% endif %}

# Called by [filament_switch_sensor T0_filament] when filament is pushed in.
# Klipper only fires this when it isn't actively printing.
[gcode_macro _FILAMENT_INSERTED]
gcode:
  {% if printer.print_stats.state == "paused" or printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Filament detected. Print is paused: run LOAD_FILAMENT, then RESUME.")}
  {% else %}
    {action_respond_info("Filament detected. Auto-loading...")}
    LOAD_FILAMENT
  {% endif %}

# Called by [gcode_button T0_unload] when the Orbiter unload button is pressed.
[gcode_macro _UNLOAD_BUTTON]
gcode:
  {% if printer.print_stats.state == "printing" or printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Unload button ignored while a print is running.")}
  {% else %}
    UNLOAD_FILAMENT
  {% endif %}

# Called by [filament_switch_sensor T0_filament] after it pauses the print on runout.
[gcode_macro _FILAMENT_RUNOUT]
gcode:
  M117 Filament runout
  {action_respond_info("Filament runout on T0. Print paused: load filament (it will not auto-load while paused), run LOAD_FILAMENT, then RESUME.")}

[gcode_macro CLEAN_NOZZLE]
description: Purge at hot temp, then wipe on the brush while cooling the active nozzle (START_TEMP -> END_TEMP)
gcode:
  # 1. DEFINE COORDINATES & PARAMETERS
  {% set START_TEMP = params.START_TEMP | default(260) | float %}   # Purge temperature
  {% set END_TEMP = params.END_TEMP | default(150) | float %}      # Keep wiping until nozzle is at/below this
  {% set WIPE_DROP = params.WIPE_DROP | default(50) | float %}     # Stop wiping once this many degrees below START_TEMP
  {% set RESTORE = params.RESTORE | default(1) | int %}            # 1 = restore previous heater target afterwards
  {% set BUCKET_X = 290 %}      # Bucket is on the positive side of the 250-280 brush
  {% set BRUSH_START_X = 250 %}
  {% set BRUSH_END_X = 280 %}
  {% set WIPE_Y = -12.0 %}
  {% set WIPE_Z = 0 %}
  {% set CLEAR_Z = 5.0 %}       # Safe travel height above the brush/frame
  {% set WIPE_END_TEMP = START_TEMP - WIPE_DROP %}
  {% set MAX_CHUNKS = 60 %}     # Safety limit: ~3 s of wiping per chunk

  # Get active extruder name dynamically for multi-tool setups
  {% set active_extruder = printer.toolhead.extruder %}
  {% set prev_target = printer[active_extruder].target | float %}

  {action_respond_info("Cleaning active tool nozzle (%s): purge at %d, wipe down to %d" % (active_extruder, START_TEMP, END_TEMP))}
  SAVE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE

  # 2. HEAT TO PURGE TEMP WHILE MOVING TO BUCKET
  SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={START_TEMP}
  G90                              ; Absolute positioning
  G0 Z{CLEAR_Z} F3000              ; Lift toolhead to clear height
  G0 X{BUCKET_X} Y{WIPE_Y} F18000  ; Fast travel to the bucket area
  TEMPERATURE_WAIT SENSOR={active_extruder} MINIMUM={START_TEMP - 3}

  # 3. PURGE
  M83                              ; Relative extrusion
  G92 E0
  G1 E15.0 F150                    ; Purge 15mm of filament into the bucket
  G1 E-5.0 F1800                   ; Retract 5mm to prevent oozing
  G92 E0                           ; Zero extruder
  G4 P500                          ; Dwell 0.5 s to let the purge string settle

  # 4. START COOLING AND WIPE UNTIL WIPE_END_TEMP IS REACHED
  SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={END_TEMP}
  G90                              ; Absolute positioning
  G0 Z{WIPE_Z} F3000               ; Lower nozzle into the bristles
  G0 X{BRUSH_END_X} F12000         ; Move to the brush edge closest to the bucket
  {% for i in range(MAX_CHUNKS) %}
    _CLEAN_NOZZLE_WIPE EXTRUDER={active_extruder} END_TEMP={WIPE_END_TEMP} X1={BRUSH_START_X} X2={BRUSH_END_X}
  {% endfor %}

  # 5. PARK OVER THE BIN AND FINISH COOLING TO END_TEMP
  G0 Z{CLEAR_Z} F3000              ; Lift clear of the bristles
  G0 X{BUCKET_X} Y{WIPE_Y} F18000  ; Park over the bucket so any ooze drips in the bin
  TEMPERATURE_WAIT SENSOR={active_extruder} MAXIMUM={END_TEMP + 1}

  # 6. EXIT
  {% if RESTORE == 1 %}
    SET_HEATER_TEMPERATURE HEATER={active_extruder} TARGET={prev_target}
  {% endif %}
  RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE_STATE
  RESPOND MSG="Nozzle cleaning complete."

# Helper: does ~3 s of wiping ONLY if the nozzle is still above END_TEMP.
# CLEAN_NOZZLE calls it repeatedly; each call renders at run time, so it sees
# the live temperature (Klipper does not allow macros to call themselves).
[gcode_macro _CLEAN_NOZZLE_WIPE]
gcode:
  {% set end_temp = params.END_TEMP | float %}
  {% set x1 = params.X1 | float %}
  {% set x2 = params.X2 | float %}
  {% set y1 = params.Y1 | default(-12) | float %}
  {% set y2 = params.Y2 | default(-10) | float %}
  {% if printer[params.EXTRUDER].temperature | float > end_temp + 1.0 %}
    {% for i in range(5) %}
      G0 X{x1} Y{y2} F6000
      G0 X{x2} Y{y1} F6000
    {% endfor %}
  {% endif %}


[gcode_macro PRINT_START]
gcode:
  # Gather all variables
  {% set TOOL = params.TOOL | default(0) | int %}
  {% set TOOL_TEMP = params.TOOL_TEMP | default(0) | int %}
  {% set BED_TEMP = params.BED_TEMP | default(0) | int %}
  {% set CHAMBER = params.CHAMBER | default(0) | float %}     # 0 = no soak (PLA etc.)
  {% set SOAK_MIN = params.SOAK_MIN | default(10) | float %}  # Minutes, covers frame lag
  {% set SOAK_MAX = params.SOAK_MAX | default(45) | float %}  # Minutes, hard cap

  # Refuse to start with no filament loaded (skipped if the sensor is disabled in Fluidd)
  {% set fs = printer["filament_switch_sensor T0_filament"] %}
  {% if fs is defined and fs.enabled and not fs.filament_detected %}
    {action_raise_error("No filament detected on T0. Load filament and start the print again.")}
  {% endif %}

  # Snapshot temperatures BEFORE heating to judge whether we're already soaked
  {% set chamber_now = printer["temperature_sensor chamber"].temperature | float %}
  {% set bed_now = printer.heater_bed.temperature | float %}
  {% set bed_was_hot = bed_now >= BED_TEMP - 5 %}
  {% set chamber_warm = chamber_now >= CHAMBER - 2 %}

  # Stop any manual soak, leftover print soak or cooldown timers now that a real job is beginning
  UPDATE_DELAYED_GCODE ID=cooldown_bed_timer DURATION=0
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=0
  UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0

  # Save variables for the post-soak macro
  SET_GCODE_VARIABLE MACRO=_START_PRINT_POST_SOAK VARIABLE=tool VALUE={TOOL}
  SET_GCODE_VARIABLE MACRO=_START_PRINT_POST_SOAK VARIABLE=tool_temp VALUE={TOOL_TEMP}

  {% if printer.tool_probe_endstop is defined %}
    M117 Disabling crash detection
    STOP_CRASH_DETECTION
  {% endif %}

  # Decide whether to soak
  {% if CHAMBER <= 0 or (bed_was_hot and chamber_warm) %}
    {% if CHAMBER <= 0 %}
      {action_respond_info("No chamber target for this filament. Skipping heat soak.")}
    {% else %}
      {action_respond_info("Already soaked (bed %.0fC, chamber %.1fC). Skipping heat soak." % (bed_now, chamber_now))}
    {% endif %}
    M117 Heating Bed
    M190 S{BED_TEMP}
    _START_PRINT_POST_SOAK

  {% else %}
    # Chamber already warm but bed was cold: short soak so the bed plate settles
    {% set min_minutes = [SOAK_MIN, 5] | min if chamber_warm else SOAK_MIN %}
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=bed_target VALUE={BED_TEMP}
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=bed_ready VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=target VALUE={CHAMBER}
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=min_s VALUE={(min_minutes * 60) | int}
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=max_s VALUE={(SOAK_MAX * 60) | int}
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=elapsed VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=last_temp VALUE=-100
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=stable_count VALUE=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=1

    {action_respond_info("Heating bed to %dC, then heat soaking. The print shows as paused until the soak ends; CANCEL works any time, SKIP_SOAK continues early." % BED_TEMP)}
    M117 Heating Bed
    M140 S{BED_TEMP}   ; Heat asynchronously; the soak timer waits for the bed
    # Pause the print file here. The soak timer runs the rest of the start
    # sequence (_START_PRINT_POST_SOAK) and resumes when the soak is done.
    PAUSE_BASE
    UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=1
  {% endif %}

[gcode_macro _START_PRINT_POST_SOAK]
# Storage for variables passed from the initial start macro
variable_tool: 0
variable_tool_temp: 0
gcode:
  # Retrieve saved variables
  {% set TOOL = printer["gcode_macro _START_PRINT_POST_SOAK"].tool | int %}
  {% set TOOL_TEMP = printer["gcode_macro _START_PRINT_POST_SOAK"].tool_temp | int %}
  # Purge T0 at the filament temp if T0 is the printing tool, otherwise use the macro default
  {% set CLEAN_TEMP = TOOL_TEMP if (TOOL == 0 and TOOL_TEMP > 0) else 260 %}

  M117 Homing
  G28

  T0 ; Ensure we have T0 active for pre print calibrations.

  M117 Quad Gantry Level
  QUAD_GANTRY_LEVEL
  G28 Z ; Re-home Z so the brush height is correct after leveling

  M117 Cleaning Nozzle
  CLEAN_NOZZLE START_TEMP={CLEAN_TEMP} RESTORE=0

  G28 Z ; Home Z again after QGL

  BED_MESH_CALIBRATE ADAPTIVE=1 ; Run adaptive bed mesh

  ; Switch to the initial printing tool and preheat it.
  {% if TOOL > 0 %}
    M104 T0 S0 ; Shutdown T0.
    T{TOOL} ; Switch to the initial printing tool
  {% endif %}

  M117 Waiting on T{TOOL} S{TOOL_TEMP}C
  M109 S{TOOL_TEMP} ; Wait for the tool to reach the target temperature

  {% if printer.tool_probe_endstop is defined %}
    M117 Re-enabling crash detection
    START_CRASH_DETECTION
  {% endif %}

[gcode_macro PRINT_END]
gcode:
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z] | min %}

  M220 S100 ; Set feed rate to 100%
  M221 S100 ; Set flow rate to 100%

  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  # Retract only if the nozzle is hot enough to extrude
  {% if printer[th.extruder].can_extrude %}
    G92 E0 ; Zero the extruder
    G1 E-2.0 F3600 ; Retract filament
  {% endif %}
  M400 ; Wait for buffer to clear

  T0 ; Switch to tool 0

  G90 ; Absolute positioning
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; Move nozzle to break stringing
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; Park nozzle at rear

  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; Reset gcode offset

  {% for tn in printer.toolchanger.tool_numbers %}
    M104 S0 T{tn} ; Shut down tool heater
    M107 T{tn} ; Shut down tool fan
    SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; Disable extruder stepper
  {% endfor %}

  # Keep the bed hot (do NOT turn it off here) and start the 1-hour cooldown timer
  {action_respond_info("Keeping bed heated. 1-hour cooldown timer started.")}
  UPDATE_DELAYED_GCODE ID=cooldown_bed_timer DURATION=3600


[gcode_macro CANCEL_PRINT]
description: Safely cancel the running print job and reset all macro timers
rename_existing: CANCEL_PRINT_BASE
gcode:
  # 1. READ PRINTER STATE AND SETUP SAFE PARKING VARIABLES
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}

  # Calculate a safe Z lift: raise 10mm, but don't crash into the top frame limit
  {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

  M220 S100 ; Reset Feed rate to 100%
  M221 S100 ; Reset Flow rate to 100%
  SET_PRESSURE_ADVANCE ADVANCE=0 ; Disable pressure advance

  # 2. EMERGENCY TIMERS & FLAGS RESET (stops a heat soak in progress)
  {action_respond_info("Print cancelled. Resetting all background macros and timers.")}
  UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=0
  UPDATE_DELAYED_GCODE ID=cooldown_bed_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE=0

  # Restore Fluidd's idle timeout if a PAUSE changed it
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  # 3. SAFE TOOLHEAD RETRACTION & PARKING
  {% if printer.toolhead.homed_axes == "xyz" %}
      {% if printer[printer.toolhead.extruder].can_extrude %}
          G92 E0                     ; Zero the extruder
          G1 E-4.0 F3600             ; Retract filament to prevent blobs/oozing
          M400                       ; Wait for movement buffer to clear
      {% endif %}

      G90                            ; Absolute positioning
      G0 X{x_safe} Y{y_safe} Z{z_safe} F20000 ; Quick jerk away to break string
      G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600 ; Park gantry at center-rear
  {% else %}
      {action_respond_info("Printer not fully homed; skipping toolhead park movements.")}
  {% endif %}

  # 4. RESET CALIBRATION OFFSETS
  SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0 ; Reset any active babysteps / z-offsets

  # 5. COOL DOWN CORES & DISABLE MULTI-TOOL MOTORS
  TURN_OFF_HEATERS               ; Shuts down bed and all active tools completely
  M107                           ; Turn off part cooling fans

  # Toolchanger Specific Shutdown Loop (only if the toolchanger is ready)
  {% if printer.toolchanger is defined and printer.toolchanger.status == 'ready' and printer.toolhead.homed_axes == "xyz" %}
      T0 ; Switch back to base tool 0 safely
      {% for tn in printer.toolchanger.tool_numbers %}
          M104 S0 T{tn}          ; Ensure all tool heaters are killed
          M107 T{tn}             ; Ensure all tool fans are killed
          SET_STEPPER_ENABLE STEPPER=extruder{tn if tn > 0 else ''} ENABLE=0 ; Cut extruder motor power
      {% endfor %}
  {% endif %}

  # 6. CLEAR FLUIDD PAUSE HELPERS, THEN LET KLIPPER CANCEL THE JOB
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE              ; Marks the job "cancelled", clears pause, stops the file

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}

    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}

    {action_respond_info(out|join("\n"))}

[gcode_macro GET_VARIABLE]
gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}

    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}

    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}

    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}

    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}

    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}

[gcode_macro TEST_NOTIFY]
gcode:
  {action_call_remote_method("notify", name="print_paused", message="Test notification from the Voron")}

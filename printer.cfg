## Voron 2.4 300 - StealthChanger (single tool, T0)
## Octopus Pro 1.1 + EBB36 toolboard, both on CAN.
##
## This file only pulls in the others and holds values that SAVE_CONFIG writes.
##   hardware/   machine definition (MCUs, motion, Z, bed, fans, leveling, shaping)
##   macros/     print start/end, heat soak, nozzle clean, filament, notifications
##   toolchanger/  klipper-toolchanger-easy; the tool itself is toolchanger/tools/T0.cfg
## Order matters: fluidd.cfg must come before macros/ (CANCEL_PRINT overrides Fluidd's).

[include fluidd.cfg]
[include toolchanger/readonly-configs/toolchanger-include.cfg]
[include config_backup.cfg]

# Hardware
[include hardware/misc.cfg]
[include hardware/mcu.cfg]
[include hardware/motion.cfg]
[include hardware/z_steppers.cfg]
[include hardware/bed.cfg]
[include hardware/fans_sensors.cfg]
[include hardware/leveling.cfg]
[include hardware/shaping.cfg]
[include hardware/display.cfg]

# Macros
[include macros/progress_notify.cfg]
[include macros/utility.cfg]
[include macros/notifications.cfg]
[include macros/heat_soak.cfg]
[include macros/fluidd_client.cfg]
[include macros/filament.cfg]
[include macros/nozzle_clean.cfg]
[include macros/print_start.cfg]
[include macros/print_end.cfg]
[include macros/axiscope.cfg]
[include macros/spoolman.cfg]
[include macros/nfc_filament.cfg]

#####################################################################
#   Calibration values (keep in this file)
#####################################################################
# SAVE_CONFIG can only update values that are set here, not in included
# files, so PID and input shaper results stay in printer.cfg.

[heater_bed]
control: pid
pid_kp = 44.365
pid_ki = 1.227
pid_kd = 400.952

[input_shaper]
# shaper_type_x / shaper_freq_x / shaper_type_y / shaper_freq_y are written by SAVE_CONFIG.
# Per-tool overrides go in the tool file (params_input_shaper_* in T0.cfg).

#### crowsnest.conf
#### Two cameras, addressed by their permanent /dev/v4l/by-id names so they
#### can't swap if /dev/videoN numbering changes between boots.
####
####   umbilical  port 8080  -> Fluidd /webcam/   (print monitoring, notification snapshots)
####   axiscope   port 8081  -> Fluidd /webcam2/  (nozzle XY alignment)
####
#### Check what each camera really delivers:
####   v4l2-ctl -d /dev/v4l/by-id/<name> --list-formats-ext
#### Resolutions below are taken from the sizes crowsnest logged for each camera.

[crowsnest]
log_level: verbose                      # Valid Options are quiet/verbose/debug
rollover_on_start: false                # Creates a backup and clears the log on every restart, if set to true
no_proxy: false                         # If set to true, no reverse proxy is required. Only change this, if you know what you are doing.

[cam umbilical]
mode: ustreamer                         # https://docs.mainsail.xyz/crowsnest/faq/backends
port: 8080                              # HTTP/MJPG stream/snapshot port
device: /dev/v4l/by-id/usb-USB_USB-video-index0
resolution: 1280x720                    # MJPG at 30 fps on this camera; ~1/2 the data of 1080p for smooth viewing
max_fps: 10                             # If hardware supports it, it will be forced, otherwise ignored/coerced.

[cam axiscope]
mode: ustreamer
port: 8081
device: /dev/v4l/by-id/usb-Suyin_HD_Camera_200910120001-video-index0
resolution: 1280x800                    # OV9726 native (MJPG): full sensor, no crop
max_fps: 15

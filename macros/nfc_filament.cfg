#####################################################################
#   NFC spool tags (nfc2klipper) - filament tracking
#####################################################################
# nfc2klipper reads a spool's tag and runs:
#   SET_ACTIVE_SPOOL ID=<spool>        (macros/spoolman.cfg -> Moonraker/Spoolman)
#   SET_ACTIVE_FILAMENT ID=<filament>  (below; remembered across restarts)
# Slicer filament start gcode (spoolman2slicer per-filament profiles) runs
#   ASSERT_ACTIVE_FILAMENT ID=<filament>
# which pauses the print if a different filament is loaded.
# Don't include nfc2klipper's klipper-spoolman.cfg: it duplicates SET_ACTIVE_SPOOL
# and its check calls M600, which this printer doesn't define.

[save_variables]
filename: ~/printer_data/config/saved_variables.cfg

[gcode_macro SET_ACTIVE_FILAMENT]
description: Remember which Spoolman filament is loaded. ID=<filament id>, ID=0 = unknown
gcode:
  {% set id = params.ID | default(-1) | int %}
  {% if id >= 0 %}
    SAVE_VARIABLE VARIABLE=active_filament VALUE={id}
    RESPOND MSG="Active filament set to {id}."
  {% else %}
    RESPOND TYPE=error MSG="SET_ACTIVE_FILAMENT needs a filament number, e.g. SET_ACTIVE_FILAMENT ID=3"
  {% endif %}

[gcode_macro ASSERT_ACTIVE_FILAMENT]
description: Pause the print if the loaded filament isn't ID=<filament id>
gcode:
  {% set want = params.ID | default(0) | int %}
  {% set have = printer.save_variables.variables.active_filament | default(0) | int %}
  {% if want <= 0 %}
    RESPOND TYPE=error MSG="ASSERT_ACTIVE_FILAMENT needs a filament number, e.g. ASSERT_ACTIVE_FILAMENT ID=3"
  {% elif have == 0 %}
    RESPOND TYPE=error MSG="No filament scanned (slicer expects filament {want}). Continuing. Scan the spool's tag to enable this check."
  {% elif have != want %}
    RESPOND TYPE=error MSG="Wrong filament loaded: slicer expects filament {want}, tag says {have}. Print paused."
    PAUSE
  {% endif %}

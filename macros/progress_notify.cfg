#####################################################################
#   Progress notifications: snapshot every 10%, halfway, ~5 minutes left
#####################################################################
# Included from printer.cfg as macros/progress_notify.cfg.
# Moonraker notifiers used: print_progress (text) and print_snapshot (with a
# camera picture, attach: http://localhost:8090/snapshot from snapflip).
#
# Remaining time comes from the slicer's M73 R<minutes> lines when the slicer
# emits them (Orca/PrusaSlicer/SuperSlicer do by default). Klipper normally
# ignores R, so M73 is wrapped here to capture it. If the file has no M73 R,
# a 30 s background check estimates remaining time from progress instead.
#
# Each notification is sent once per print. Prints shorter than min_total_min
# minutes send none. With snapshots on, the 50% picture is the "Halfway"
# notification (no separate text-only halfway message).

[gcode_macro _PROGRESS_NOTIFY]
variable_half_pct: 50          # "Halfway" threshold, percent
variable_left_min: 5           # "Almost done" threshold, minutes
variable_min_total_min: 10     # Skip all of these for prints shorter than this
variable_snap_every_pct: 10    # Picture every N percent (0 = pictures off)
# --- state, reset automatically for each print ---
variable_filename: ""
variable_last_pd: 0.0           # print_duration at last check; drops when a new job starts
variable_half_sent: 0
variable_last_snap: 0          # Last percent a picture was sent for
variable_left_sent: 0
variable_m73_seen: 0           # 1 = slicer is sending M73 R, use it
variable_max_r: 0              # Largest M73 R seen (= slicer's total estimate)
variable_t0: -1.0              # print_duration when real printing started (fallback)
variable_p0: 0.0               # File progress at that moment (fallback)
gcode:
  # Called with SNAP=<percent>, HALF=1 or LEFT=1, plus MIN=<minutes left>.
  # Each fires at most once per print (SNAP once per percent step).
  {% set v = printer["gcode_macro _PROGRESS_NOTIFY"] %}
  {% set fname = printer.print_stats.filename.split('/')[-1] %}
  {% set mins = params.MIN | default(0) | float %}
  {% if params.SNAP is defined %}
    {% set pct = params.SNAP | int %}
    {% if pct > v.last_snap %}
      SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=last_snap VALUE={pct}
      {% set left = " (about %d min left)" % (mins | round | int) if mins > 0 else "" %}
      {% if pct == 50 %}
        SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=half_sent VALUE=1
        {action_call_remote_method("notify", name="print_snapshot",
            message="Halfway: %s%s" % (fname, left))}
      {% else %}
        {action_call_remote_method("notify", name="print_snapshot",
            message="%d%%: %s%s" % (pct, fname, left))}
      {% endif %}
    {% endif %}
  {% elif params.HALF is defined and v.half_sent == 0 %}
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=half_sent VALUE=1
    {action_call_remote_method("notify", name="print_progress",
        message="Halfway: %s (about %d min left)" % (fname, mins | round | int))}
  {% elif params.LEFT is defined and v.left_sent == 0 %}
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=left_sent VALUE=1
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=half_sent VALUE=1
    {action_call_remote_method("notify", name="print_progress",
        message="About %d min left: %s" % ([mins, 1] | max | round | int, fname))}
  {% endif %}

# Reset state when a new job starts (new file, or the same file reprinted).
[gcode_macro _PROGRESS_RESET_IF_NEW]
gcode:
  {% set v = printer["gcode_macro _PROGRESS_NOTIFY"] %}
  # Quotes/backslashes are stripped so the name can be stored as a variable
  {% set f = printer.print_stats.filename | replace('"', '') | replace("'", '') | replace('\\', '') %}
  {% set pd = printer.print_stats.print_duration | float %}
  SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=last_pd VALUE={pd}
  {% if f != v.filename or pd < v.last_pd %}
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=filename VALUE="'{f}'"
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=half_sent VALUE=0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=left_sent VALUE=0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=last_snap VALUE=0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=m73_seen VALUE=0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=max_r VALUE=0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=t0 VALUE=-1.0
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=p0 VALUE=0.0
  {% endif %}

# Slicer progress: M73 P<percent> R<minutes remaining>
[gcode_macro M73]
rename_existing: M73.1
gcode:
  M73.1 {rawparams}
  {% if printer.print_stats.state == "printing" and params.R is defined %}
    _PROGRESS_SLICER_CHECK P={params.P | default(-1)} R={params.R}
  {% endif %}

[gcode_macro _PROGRESS_SLICER_CHECK]
gcode:
  _PROGRESS_RESET_IF_NEW
  _PROGRESS_SLICER_EVAL P={params.P} R={params.R}

[gcode_macro _PROGRESS_SLICER_EVAL]
gcode:
  {% set v = printer["gcode_macro _PROGRESS_NOTIFY"] %}
  {% set p = params.P | float %}
  {% set r = params.R | float %}
  {% set max_r = [v.max_r, r] | max %}
  # Percent for pictures: slicer's M73 P, or file position if the slicer sends no P
  {% set pct_now = p if p >= 0 else printer.virtual_sdcard.progress * 100 %}
  SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=m73_seen VALUE=1
  SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=max_r VALUE={max_r}
  {% if max_r >= v.min_total_min %}
    {% if v.snap_every_pct > 0 %}
      {% set step = ((pct_now // v.snap_every_pct) * v.snap_every_pct) | int %}
      {% if step > v.last_snap and step < 100 %}
        _PROGRESS_NOTIFY SNAP={step} MIN={r}
      {% endif %}
    {% endif %}
    {% if r <= v.left_min %}
      _PROGRESS_NOTIFY LEFT=1 MIN={r}
    {% elif p >= v.half_pct or (p < 0 and r <= max_r / 2) %}
      _PROGRESS_NOTIFY HALF=1 MIN={r}
    {% endif %}
  {% endif %}

# Fallback when the file has no M73 R: estimate from file progress every 30 s.
[delayed_gcode _progress_notify_timer]
initial_duration: 30
gcode:
  {% set ps = printer.print_stats %}
  {% if ps.state == "printing" %}
    _PROGRESS_RESET_IF_NEW
    _PROGRESS_FALLBACK_EVAL
  {% elif ps.state != "paused" %}
    # Job finished/cancelled: forget it so a reprint of the same file starts fresh
    SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=filename VALUE="''"
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_progress_notify_timer DURATION=30

[gcode_macro _PROGRESS_FALLBACK_EVAL]
gcode:
  {% set v = printer["gcode_macro _PROGRESS_NOTIFY"] %}
  {% set pd = printer.print_stats.print_duration | float %}
  {% set p = printer.virtual_sdcard.progress | float %}
  {% if v.m73_seen == 0 %}
    {% if v.t0 < 0 %}
      # Start timing once the start gcode is behind us (file is ~1% in)
      {% if p >= 0.01 %}
        SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=t0 VALUE={pd}
        SET_GCODE_VARIABLE MACRO=_PROGRESS_NOTIFY VARIABLE=p0 VALUE={p}
      {% endif %}
    {% else %}
      {% set elapsed = pd - v.t0 %}
      {% set done = p - v.p0 %}
      # Need a few minutes of data before trusting the estimate
      {% if elapsed >= 180 and done > 0.02 %}
        {% set left_min = elapsed * (1.0 - p) / done / 60.0 %}
        {% set total_min = (elapsed / 60.0) + left_min %}
        {% if total_min >= v.min_total_min %}
          {% if v.snap_every_pct > 0 %}
            {% set step = ((p * 100 // v.snap_every_pct) * v.snap_every_pct) | int %}
            {% if step > v.last_snap and step < 100 %}
              _PROGRESS_NOTIFY SNAP={step} MIN={left_min}
            {% endif %}
          {% endif %}
          {% if left_min <= v.left_min %}
            _PROGRESS_NOTIFY LEFT=1 MIN={left_min}
          {% elif p * 100 >= v.half_pct %}
            _PROGRESS_NOTIFY HALF=1 MIN={left_min}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

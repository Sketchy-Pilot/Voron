#####################################################################
#   Axiscope helper button
#####################################################################
# After plugging in the Axiscope camera, press AXISCOPE in Fluidd's Macros panel.
# It restarts crowsnest (so the camera is picked up), starts the axiscope service,
# and prints a clickable "Open Axiscope" link in the console.
# Uses scripts/axiscope_start.sh and the gcode_shell_command extension
# (already installed; BACKUP_CFG uses it too).

[gcode_shell_command axiscope_start]
# $HOME is expanded by gcode_shell_command; a leading "bash" avoids needing chmod +x.
command: bash $HOME/printer_data/config/scripts/axiscope_start.sh
timeout: 45
verbose: True

[gcode_macro AXISCOPE]
description: Restart crowsnest for the Axiscope camera, start Axiscope and show its link
gcode:
  # RUN_SHELL_COMMAND blocks Klipper until the script finishes, so never mid-print.
  {% if printer.print_stats.state in ["printing", "paused"] %}
    RESPOND TYPE=error MSG="AXISCOPE is disabled while a print is running or paused."
  {% else %}
    RUN_SHELL_COMMAND CMD=axiscope_start
  {% endif %}

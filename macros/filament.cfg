#####################################################################
#   Filament: Orbiter sensor auto-load, unload button, runout
#####################################################################
# Hardware sections ([filament_switch_sensor T0_filament], [gcode_button T0_unload])
# live in toolchanger/tools/T0.cfg. Lengths below are for an Orbiter 2.5 + CHCB-V;
# tune them if loads stop short of the nozzle or unloads don't clear the gears.
#
# Not printing (idle):
#   Insert filament (auto-load) or LOAD_FILAMENT: grab the filament, park over the
#   bucket, heat, load and purge, then CLEAN_NOZZLE.
#   Orbiter unload button or UNLOAD_FILAMENT: park over the bucket, then unload.
#   Before parking, the toolhead waits park_delay seconds and homes first if needed.
#   The bucket position is set in CLEAN_NOZZLE (macros/nozzle_clean.cfg).
# Runout during a print:
#   The print pauses and parks: Z lifted, X in the middle, Y at max. Insert new
#   filament and it loads right there (no bucket, no brush, nothing near the print),
#   then the print stays paused so you can clean the nozzle by hand. RESUME continues.

[gcode_macro _FILAMENT_VARIABLES]
variable_load_temp: 240        # Hotend temp for loading/unloading when the nozzle is cold
variable_grab_length: 15       # Cold feed to bite the filament (FORCE_MOVE, no heat needed)
variable_load_length: 45       # Gears -> melt zone
variable_purge_length: 170     # Purge over the bucket after loading (enough to finish a color change)
variable_runout_purge_length: 20  # Purge when reloading after a runout (parked over the bed edge)
variable_purge_speed: 6        # Purge speed in mm/s of filament (6 mm/s = about 14 mm3/s for 1.75mm)
variable_tip_push: 5           # Unload: push to soften the tip
variable_tip_pull: 15          # Unload: quick pull to break the tip off cleanly
variable_unload_length: 80     # Unload: total slow pull to clear the gears
variable_lift_z: 10            # Z lift before parking (bucket park and runout park)
variable_bucket_z: 1           # Nozzle height over the bucket once parked there (load purge / unload)
variable_park_delay: 2         # Seconds to get your hand clear before the toolhead moves
gcode:

# Klipper rejects single extrude-only moves over 50mm, so long moves are split.
[gcode_macro _EXTRUDE_SPLIT]
gcode:
  {% set dist = params.E | float %}
  {% set f = params.F | default(600) | float %}
  {% set n = ((dist | abs) / 45) | round(0, 'ceil') | int %}
  {% set n = [n, 1] | max %}
  {% for i in range(n) %}
    G1 E{dist / n} F{f}
  {% endfor %}

# Parks over the bucket (homes first if needed). Only used when not printing.
[gcode_macro _FILAMENT_PARK_BUCKET]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% if printer.toolhead.homed_axes != "xyz" %}
    RESPOND MSG="Homing, then moving to the bucket. Keep hands clear."
    G4 P{fv.park_delay * 1000}
    G28
  {% else %}
    RESPOND MSG="Moving to the bucket. Keep hands clear."
    G4 P{fv.park_delay * 1000}
  {% endif %}
  _FILAMENT_MOVE_TO_BUCKET

# Separate macro so it reads the toolhead position after homing.
[gcode_macro _FILAMENT_MOVE_TO_BUCKET]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set cn = printer["gcode_macro CLEAN_NOZZLE"] %}
  {% set gm = printer.gcode_move %}
  {% set z_top = printer.toolhead.axis_maximum.z - gm.homing_origin.z %}
  {% set z_safe = [[gm.gcode_position.z + fv.lift_z, cn.clear_z] | max, z_top] | min %}
  G90
  G0 Z{z_safe} F3000                       ; Lift first, so nothing on the bed is hit
  G0 X{cn.bucket_x} Y{cn.bucket_y} F18000  ; Then travel to the bucket
  G0 Z{fv.bucket_z} F1500                  ; And drop to the purge height (off the bed, so safe)

[gcode_macro LOAD_FILAMENT]
description: Load filament on the active tool. Idle: parks over the bucket, purges and runs CLEAN_NOZZLE. Paused: loads in place. [TEMP=] [PURGE=] [PARK=0] [CLEAN=0]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set ext = printer.toolhead.extruder %}
  {% set prev_target = printer[ext].target | float %}
  {% set temp = params.TEMP | default([prev_target, fv.load_temp] | max) | float %}
  {% set grab = params.GRAB | default(1) | int %}
  {% set state = printer.print_stats.state %}
  {% set paused = state == "paused" or printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
  {% set purge = params.PURGE | default(fv.runout_purge_length if paused else fv.purge_length) | float %}
  # Never move the toolhead while a print is paused: it would have to travel over the print.
  {% set park = 0 if paused else params.PARK | default(1) | int %}
  {% set clean = 0 if paused else params.CLEAN | default(park) | int %}

  {% if state == "printing" %}
    {action_respond_info("LOAD_FILAMENT: not allowed while printing.")}
  {% else %}
    _TOOLHEAD_LED STOP=FILAMENT   ; Stop the "ready for new filament" pulse
    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    {% if grab == 1 %}
      M117 Grabbing filament
      FORCE_MOVE STEPPER={ext} DISTANCE={fv.grab_length} VELOCITY=5
    {% endif %}
    {% if park == 1 %}
      _FILAMENT_PARK_BUCKET
    {% endif %}
    M117 Heating to {temp|int}C to load
    M109 S{temp}
    M117 Loading filament
    M83
    _EXTRUDE_SPLIT E={fv.load_length} F=600
    _EXTRUDE_SPLIT E={purge} F={fv.purge_speed * 60}   ; Split: Klipper rejects single extrude-only moves over 50mm
    G1 E-1 F1800        ; small retract to limit ooze
    M400
    {% if clean == 1 %}
      CLEAN_NOZZLE START_TEMP={temp} RESTORE=0
    {% endif %}
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_STATE
    SET_HEATER_TEMPERATURE HEATER={ext} TARGET={prev_target}
    M117 Filament loaded
    {% if paused %}
      RESPOND TYPE=error MSG="Filament loaded. The print stays paused: clean the nozzle, then press RESUME to continue."
    {% else %}
      RESPOND MSG="Filament loaded."
    {% endif %}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Heat (if needed), form a clean tip and pull the filament out of the active tool. Idle: parks over the bucket first. [TEMP=] [PARK=0]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set ext = printer.toolhead.extruder %}
  {% set prev_target = printer[ext].target | float %}
  {% set temp = params.TEMP | default([prev_target, fv.load_temp] | max) | float %}
  {% set state = printer.print_stats.state %}
  {% set paused = state == "paused" or printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
  {% set park = 0 if paused else params.PARK | default(1) | int %}

  {% if state == "printing" %}
    {action_respond_info("UNLOAD_FILAMENT: not allowed while printing.")}
  {% else %}
    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    {% if park == 1 %}
      _FILAMENT_PARK_BUCKET
    {% endif %}
    M117 Heating to {temp|int}C to unload
    M109 S{temp}
    M117 Unloading filament
    M83
    G1 E{fv.tip_push} F300
    G1 E-{fv.tip_pull} F3000
    G4 P2000
    _EXTRUDE_SPLIT E=-{fv.unload_length} F=1200
    M400
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_STATE
    {% if not paused %}
      SET_HEATER_TEMPERATURE HEATER={ext} TARGET={prev_target}
    {% endif %}
    M117 Filament unloaded
    RESPOND MSG="Filament unloaded. Pull the old filament out and push the new one in."
    CLEAR_ACTIVE_SPOOL   ; Spoolman: stop charging usage to the spool that came out
    {% if printer["gcode_macro SET_ACTIVE_FILAMENT"] is defined %}
      SET_ACTIVE_FILAMENT ID=0   ; Filament now unknown: prints warn instead of pausing until a tag is scanned
    {% endif %}
    _TOOLHEAD_LED MODE=FILAMENT   ; Toolhead LEDs pulse blue until new filament goes in
  {% endif %}

# Called by [filament_switch_sensor T0_filament] when filament is pushed in.
# Klipper only fires this when it isn't actively printing.
[gcode_macro _FILAMENT_INSERTED]
gcode:
  _TOOLHEAD_LED STOP=FILAMENT   ; New filament is in: stop the blue pulse
  {% if printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Filament detected during the heat soak. Run LOAD_FILAMENT to load it here.")}
  {% elif printer.print_stats.state == "paused" %}
    {action_respond_info("Filament detected. Loading in place (print stays paused)...")}
    LOAD_FILAMENT
  {% else %}
    {action_respond_info("Filament detected. Auto-loading...")}
    LOAD_FILAMENT
  {% endif %}

# Called by [gcode_button T0_unload] when the Orbiter unload button is pressed.
[gcode_macro _UNLOAD_BUTTON]
gcode:
  {% if printer.print_stats.state == "printing" or printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Unload button ignored while a print is running.")}
  {% else %}
    UNLOAD_FILAMENT   ; Waits park_delay seconds (hand clear), then parks over the bucket
  {% endif %}

# Called by [filament_switch_sensor T0_filament] on runout while printing
# (pause_on_runout is off there, so this does the pause and picks the park spot).
[gcode_macro _FILAMENT_RUNOUT]
gcode:
  {% set fv = printer["gcode_macro _FILAMENT_VARIABLES"] %}
  {% set th = printer.toolhead %}
  {% set gm = printer.gcode_move %}
  {% set x = th.axis_maximum.x / 2 - gm.homing_origin.x %}
  {% set y = th.axis_maximum.y - gm.homing_origin.y %}
  {% set z = gm.gcode_position.z + fv.lift_z %}
  PAUSE X={x} Y={y} Z_MIN={z}
  M117 Filament runout
  RESPOND TYPE=error MSG="Filament runout on T0. Print paused. Insert new filament (it loads in place), clean the nozzle, then press RESUME."

# RESUME used by Fluidd's Resume button. This replaces the toolchanger's RESUME
# (which skipped Fluidd's checks): it refuses to resume without filament, ends a
# heat soak properly, waits for the nozzle to be back at print temperature,
# runs the toolchanger checks and then continues the print.
[gcode_macro RESUME]
description: Resume the paused print (checks filament, heat soak, nozzle temperature and tool first)
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set rv = printer['gcode_macro RESUME'] %}
  {% set soak = printer['gcode_macro _HEAT_SOAK_VARIABLES'].print_soak_active == 1 %}
  {% set sensor = client.runout_sensor | default("") %}
  {% set has_filament = sensor == "" or not printer[sensor].enabled or printer[sensor].filament_detected %}
  {% set last = rv.last_extruder_temp %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND MSG="Nothing to resume: the print is not paused."
  {% elif not has_filament %}
    RESPOND TYPE=error MSG="Resume aborted: no filament detected on T0. Load filament, then press RESUME."
  {% else %}
    {% if rv.restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={rv.restore_idle_timeout}
    {% endif %}
    {% if soak %}
      _SOAK_RESUME_GUARD
    {% elif last.restore and last.temp > 0 %}
      M109 S{last.temp}   ; Back to print temperature (load temp or idle cooling may differ)
    {% endif %}
    INITIALIZE_TOOLCHANGER
    VERIFY_TOOL_DETECTED
    {% if not soak %}
      _CLIENT_EXTRUDE   ; Undo the retract PAUSE made
    {% endif %}
    RESUME_BASE {rawparams}
  {% endif %}

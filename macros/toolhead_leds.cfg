#####################################################################
#   Toolhead LEDs (Dragon Burner: INDEX 1-2 nozzle, 3 logo)
#####################################################################
# Steady colours (when no pulse is running):
#   logo green + nozzle LEDs white - idle, and while a print is actually printing.
#   all purple                     - a print is busy with anything else: the start
#                                    sequence (homing, QGL, mesh, nozzle clean, heating),
#                                    paused (incl. filament runout), and PRINT_END.
#
# Pulses (all three LEDs, they take priority over the steady colours):
#   blue,   fast (2 s) - unload done: pull the old filament, push the new one in.
#                        Ends when filament goes in, a load starts or a print starts.
#   yellow, slow (4 s) - heat soak: SOLID yellow while the bed heats up, then the
#                        slow pulse while waiting for the chamber (print soak or HEAT_SOAK).
#                        Ends by itself when the soak ends, is skipped or cancelled.
# Solid yellow also shows whenever PRINT_START (or a skipped soak) waits for the bed.
#   red,    slow (4 s) - the print stopped on an error, or the toolchanger lost the tool.
#                        Stays until the next print starts or you run TOOLHEAD_LED_DEFAULT.
# When a pulse ends, the LEDs go to the steady colour for what the printer is doing.
# Klipper can't drive LEDs after a shutdown (thermal runaway, MCU errors, emergency
# stop), so those can't show red; the LEDs keep their last colour until FIRMWARE_RESTART.
# Klipper has no LED effects built in, so a timer steps the brightness.
# Every SET_LED uses SYNC=0: otherwise each update wakes the toolhead, Klipper's
# idle_timeout reports "Printing" while a pulse runs, and the filament sensor then
# skips auto-load, treats pulling filament out as a runout, and the idle timeout
# never turns heaters/motors off.

[gcode_macro TOOLHEAD_LED_DEFAULT]
description: Stop any LED pulse and show the steady colours (green/white, or purple while a print is busy)
gcode:
  {% if printer["gcode_macro _TOOLHEAD_LED"].mode != "" %}
    SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=mode VALUE='""'
    UPDATE_DELAYED_GCODE ID=_toolhead_led_pulse DURATION=0
  {% endif %}
  _TOOLHEAD_LED_REST

# Steady colour for what the printer is doing (does nothing while a pulse is running).
[gcode_macro _TOOLHEAD_LED_REST]
variable_logo_index: 3
variable_logo: [0.0, 1.0, 0.0]          # Red, green, blue (0-1)
variable_nozzle_indexes: [1, 2]
variable_nozzle: [1.0, 1.0, 1.0]        # White
variable_busy: [0.6, 0.0, 1.0]          # Purple, all LEDs
gcode:
  {% set v = printer["gcode_macro _TOOLHEAD_LED"] %}
  {% set state = printer.print_stats.state %}
  {% if v.mode == "" %}
    {% if state in ("printing", "paused") and (v.phase == "busy" or (v.phase == "printing" and state != "printing")) %}
      SET_LED LED={v.led} RED={busy[0]} GREEN={busy[1]} BLUE={busy[2]} SYNC=0
    {% else %}
      {% for i in nozzle_indexes %}
        SET_LED LED={v.led} INDEX={i} RED={nozzle[0]} GREEN={nozzle[1]} BLUE={nozzle[2]} TRANSMIT=0 SYNC=0
      {% endfor %}
      SET_LED LED={v.led} INDEX={logo_index} RED={logo[0]} GREEN={logo[1]} BLUE={logo[2]} SYNC=0
    {% endif %}
  {% endif %}

# After RESUME_BASE the print state is still "paused" until Klipper restarts reading
# the file a moment later, so set the colour then (otherwise it stays purple).
[gcode_macro _TOOLHEAD_LED_AFTER_RESUME]
gcode:
  UPDATE_DELAYED_GCODE ID=_toolhead_led_refresh DURATION=1

[delayed_gcode _toolhead_led_refresh]
gcode:
  _TOOLHEAD_LED_REST

# Normal colours shortly after Klipper starts ([neopixel] can only set one colour for all)
[delayed_gcode _toolhead_led_startup]
initial_duration: 1
gcode:
  TOOLHEAD_LED_DEFAULT

# Solid yellow while a macro waits for the bed (M190). Call _TOOLHEAD_LED_REST afterwards.
# Does nothing while a pulse is running.
[gcode_macro _TOOLHEAD_LED_BED_HEATING]
gcode:
  {% set v = printer["gcode_macro _TOOLHEAD_LED"] %}
  {% if v.mode == "" %}
    {% set c = v.effects.soak.color %}
    SET_LED LED={v.led} RED={c[0]} GREEN={c[1]} BLUE={c[2]} SYNC=0
  {% endif %}

# _TOOLHEAD_LED MODE=FILAMENT|SOAK|ERROR   start that pulse (replaces any running one)
# _TOOLHEAD_LED STOP=FILAMENT|SOAK|ERROR   end it if that one is running -> steady colours
# _TOOLHEAD_LED STOP=ALL                   end whatever is running -> steady colours
# _TOOLHEAD_LED PHASE=BUSY|PRINTING|IDLE   where the print is (PRINT_START/PRINT_END set it)
[gcode_macro _TOOLHEAD_LED]
variable_led: "T0"             # [neopixel T0]
variable_effects: {
    "filament": {"color": [0.0, 0.0, 1.0], "period": 2.0},
    "soak":     {"color": [1.0, 0.7, 0.0], "period": 4.0},
    "error":    {"color": [1.0, 0.0, 0.0], "period": 4.0}}
                               # color = red, green, blue (0-1); period = seconds per pulse
variable_steps: 16             # Brightness steps per pulse
variable_min: 0.05             # Dimmest point (0-1)
variable_max: 1.0              # Brightest point (0-1)
variable_mode: ""              # state, managed by the macros: running effect, "" = none
variable_step: 0
variable_phase: "idle"         # state: idle | busy (start/end sequence) | printing
gcode:
  {% if params.PHASE is defined %}
    {% set ph = params.PHASE | lower %}
    {% if ph in ("idle", "busy", "printing") %}
      SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=phase VALUE='"{ph}"'
      _TOOLHEAD_LED_REST
    {% else %}
      {action_respond_info("_TOOLHEAD_LED: unknown PHASE '%s' (use BUSY, PRINTING or IDLE)" % params.PHASE)}
    {% endif %}
  {% elif params.MODE is defined %}
    {% set m = params.MODE | lower %}
    {% if m not in effects %}
      {action_respond_info("_TOOLHEAD_LED: unknown MODE '%s' (use %s)" % (params.MODE, ", ".join(effects | list | map("upper"))))}
    {% else %}
      SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=step VALUE=0
      SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=mode VALUE='"{m}"'
      UPDATE_DELAYED_GCODE ID=_toolhead_led_pulse DURATION=0.1
    {% endif %}
  {% elif params.STOP is defined %}
    # Only end the named pulse, so e.g. inserting filament doesn't clear an error
    {% if mode != "" and (params.STOP | lower == "all" or params.STOP | lower == mode) %}
      TOOLHEAD_LED_DEFAULT
    {% endif %}
  {% endif %}

[delayed_gcode _toolhead_led_pulse]
gcode:
  {% set v = printer["gcode_macro _TOOLHEAD_LED"] %}
  {% set hs = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.mode in v.effects %}
    {% if v.mode == "filament" and printer.print_stats.state == "printing" %}
      TOOLHEAD_LED_DEFAULT     # A print started: back to the steady colours
    {% elif v.mode == "soak" and hs.print_soak_active == 0 and hs.manual_soak_active == 0 %}
      TOOLHEAD_LED_DEFAULT     # Soak finished, skipped or cancelled
    {% elif v.mode == "soak" and ((hs.print_soak_active == 1 and hs.bed_ready == 0) or
                                  (hs.print_soak_active == 0 and hs.manual_bed_ready == 0)) %}
      # Bed still heating: solid yellow, check again in a second. The pulse then starts
      # from its brightest point so there's no jump.
      {% set c = v.effects.soak.color %}
      SET_LED LED={v.led} RED={c[0]} GREEN={c[1]} BLUE={c[2]} SYNC=0
      SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=step VALUE={v.steps // 2}
      UPDATE_DELAYED_GCODE ID=_toolhead_led_pulse DURATION=1
    {% else %}
      {% set e = v.effects[v.mode] %}
      # Eased triangle wave: smooth fade up and down without trig functions
      {% set t = 1.0 - ((2.0 * v.step / v.steps) - 1.0) | abs %}
      {% set b = v.min + (v.max - v.min) * t * t %}
      SET_LED LED={v.led} RED={"%.3f" % (e.color[0] * b)} GREEN={"%.3f" % (e.color[1] * b)} BLUE={"%.3f" % (e.color[2] * b)} SYNC=0
      SET_GCODE_VARIABLE MACRO=_TOOLHEAD_LED VARIABLE=step VALUE={(v.step + 1) % v.steps}
      UPDATE_DELAYED_GCODE ID=_toolhead_led_pulse DURATION={e.period / v.steps}
    {% endif %}
  {% endif %}

# Red pulse when a print stops on an error. This replaces Fluidd's on_error_gcode
# (fluidd.cfg: CANCEL_PRINT) with the same cancel followed by the LED.
[virtual_sdcard]
on_error_gcode:
  CANCEL_PRINT
  _TOOLHEAD_LED MODE=ERROR

# Red pulse when the toolchanger loses the tool. Same crash_gcode as
# toolchanger/readonly-configs/tool_detection.cfg, plus the LED.
[tool_probe_endstop]
crash_gcode:
  RESPOND TYPE=error MSG='Tool not detected, expected {printer.toolchanger.tool_number}. Aborting the print.'
  M84
  TURN_OFF_HEATERS
  _TOOLHEAD_LED MODE=ERROR

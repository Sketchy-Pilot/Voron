#####################################################################
#   Spoolman (spool usage tracking through Moonraker)
#####################################################################
# Moonraker's [spoolman] section does the tracking; these macros tell it which
# spool is loaded. Fluidd's spool picker sets the spool directly; these are for
# slicer filament start gcode and the console:
#   SET_ACTIVE_SPOOL ID=<spool id>
#   CLEAR_ACTIVE_SPOOL
# If Moonraker/Spoolman is unavailable, Klipper only logs the failed call, so
# these never stop a print. UNLOAD_FILAMENT clears the active spool when done.

[gcode_macro SET_ACTIVE_SPOOL]
description: Track filament usage against a Spoolman spool. ID=<spool id>
gcode:
  {% set id = params.ID | default(0) | int %}
  {% if id > 0 %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
    RESPOND MSG="Active spool set to {id}."
  {% else %}
    RESPOND TYPE=error MSG="SET_ACTIVE_SPOOL needs a spool number, e.g. SET_ACTIVE_SPOOL ID=12"
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Stop tracking filament usage against any spool
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
  RESPOND MSG="Active spool cleared."

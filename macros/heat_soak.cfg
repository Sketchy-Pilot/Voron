#####################################################################
#   Heat soak
#####################################################################
# The print heat soak runs on a timer while the print is PAUSED, so
# CANCEL works at any point during bed heating and the soak.
# SKIP_SOAK ends the soak early and continues the print.
# HEAT_SOAK / STOP_HEAT_SOAK are for manual pre-heating outside a print.

[gcode_macro _HEAT_SOAK_VARIABLES]
# Manual soak (HEAT_SOAK)
variable_time_remaining: 0
variable_manual_soak_active: 0  # 1 = manual soak in progress
variable_manual_bed_target: 0
variable_manual_bed_ready: 0
# Print soak (PRINT_START)
variable_print_soak_active: 0   # 1 = print is paused for a heat soak
variable_bed_target: 0
variable_bed_ready: 0           # 1 = bed reached temp, soak clock running
variable_target: 0              # Chamber target (C)
variable_min_s: 0
variable_max_s: 0
variable_elapsed: 0             # Seconds into the current print soak
variable_last_temp: -100.0      # Chamber temp at the last 1-minute sample
variable_stable_count: 0        # Consecutive minutes with < 0.3C rise
gcode:

[gcode_macro HEAT_SOAK]
description: Pre-heat the bed and run a timed heat soak (outside a print). STOP_HEAT_SOAK to end it.
gcode:
  {% set TARGET = params.TARGET | default(100) | int %}
  {% set DURATION = params.DURATION | default(15) | int %}

  # Kill any cooldown timers if they were running
  UPDATE_DELAYED_GCODE ID=cooldown_bed_timer DURATION=0

  {action_respond_info("Manual heat soak: heating bed to %dC, then soaking %d min. STOP_HEAT_SOAK to end." % (TARGET, DURATION))}
  M140 S{TARGET} # Heat asynchronously; the timer waits for the bed

  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE={DURATION}
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_target VALUE={TARGET}
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_ready VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=1
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=1

[gcode_macro STOP_HEAT_SOAK]
description: Stop a manual heat soak. BED_OFF=1 (default) also turns the bed off.
gcode:
  {% set BED_OFF = params.BED_OFF | default(1) | int %}
  UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE=0
  {% if BED_OFF == 1 %}
    M140 S0
  {% endif %}
  {action_respond_info("Manual heat soak stopped.")}

[delayed_gcode heat_soak_timer]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.manual_soak_active == 1 %}
    {% if v.manual_bed_ready == 0 %}
      {% if printer.heater_bed.temperature >= v.manual_bed_target - 1 %}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_bed_ready VALUE=1
        {action_respond_info("Bed at temperature. Starting %d minute manual heat soak countdown..." % v.time_remaining)}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=60
      {% else %}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=5
      {% endif %}
    {% else %}
      {% set remaining = v.time_remaining | int - 1 %}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=time_remaining VALUE={remaining}
      {% if remaining > 0 %}
        {action_respond_info("Heat soaking... %d minutes remaining." % remaining)}
        UPDATE_DELAYED_GCODE ID=heat_soak_timer DURATION=60
      {% else %}
        {action_respond_info("Manual heat soak complete! Bed will stay hot until you start a print.")}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=manual_soak_active VALUE=0
      {% endif %}
    {% endif %}
  {% endif %}

# One step of the print heat soak. While the bed is heating it checks every
# 5 s; once the bed is at temp it runs once a minute.
[delayed_gcode print_soak_timer]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.print_soak_active == 1 %}
    {% set chamber = printer["temperature_sensor chamber"].temperature | float %}

    {% if v.bed_ready == 0 %}
      {% if printer.heater_bed.temperature >= v.bed_target - 1 %}
        {action_respond_info("Bed at %dC. Heat soaking to %.0fC chamber (min %d, max %d min)..." % (v.bed_target, v.target, v.min_s // 60, v.max_s // 60))}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=bed_ready VALUE=1
        M117 Heat soaking
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=1
      {% else %}
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=5
      {% endif %}

    {% else %}
      {% set elapsed = v.elapsed | int %}
      # Once a minute, check whether the chamber has stopped rising
      {% set stable = v.stable_count + 1 if chamber - v.last_temp < 0.3 else 0 %}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=last_temp VALUE={chamber}
      SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=stable_count VALUE={stable}

      {% if elapsed >= v.max_s %}
        {action_respond_info("Heat soak hit the %d min limit (chamber %.1fC). Continuing." % (v.max_s // 60, chamber))}
        _FINISH_PRINT_SOAK
      {% elif elapsed >= v.min_s and chamber >= v.target %}
        {action_respond_info("Chamber reached %.1fC after %d min. Heat soak complete." % (chamber, elapsed // 60))}
        _FINISH_PRINT_SOAK
      {% elif elapsed >= v.min_s and stable >= 3 %}
        {action_respond_info("Chamber leveled off at %.1fC after %d min. Heat soak complete." % (chamber, elapsed // 60))}
        _FINISH_PRINT_SOAK
      {% else %}
        {action_respond_info("Heat soaking: %d min, chamber %.1f / %.0fC" % (elapsed // 60, chamber, v.target))}
        SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=elapsed VALUE={elapsed + 60}
        UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=60
      {% endif %}
    {% endif %}
  {% endif %}

# Ends the print soak: runs the pre-print sequence, then resumes the paused print.
[gcode_macro _FINISH_PRINT_SOAK]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
  SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0
  M190 S{v.bed_target}   ; Instant if the bed is already at temp (matters for SKIP_SOAK)
  _START_PRINT_POST_SOAK
  # Re-save the pause state at the current (post-homing) position so that
  # RESUME_BASE doesn't try to move back to where the toolhead was before homing.
  SAVE_GCODE_STATE NAME=PAUSE_STATE
  RESUME_BASE

[gcode_macro SKIP_SOAK]
description: End the current print heat soak early and continue the print
gcode:
  {% if printer["gcode_macro _HEAT_SOAK_VARIABLES"].print_soak_active == 1 %}
    {action_respond_info("Skipping the rest of the heat soak.")}
    _FINISH_PRINT_SOAK
  {% else %}
    {action_respond_info("No print heat soak is running.")}
  {% endif %}

# Fluidd's RESUME button runs this just before it resumes. If a soak is in
# progress, it does the same as SKIP_SOAK's pre-print sequence so the print
# never resumes un-homed / un-leveled.
[gcode_macro _SOAK_RESUME_GUARD]
gcode:
  {% set v = printer["gcode_macro _HEAT_SOAK_VARIABLES"] %}
  {% if v.print_soak_active == 1 %}
    {action_respond_info("Resume pressed during heat soak: skipping the rest of the soak.")}
    UPDATE_DELAYED_GCODE ID=print_soak_timer DURATION=0
    SET_GCODE_VARIABLE MACRO=_HEAT_SOAK_VARIABLES VARIABLE=print_soak_active VALUE=0
    M190 S{v.bed_target}
    _START_PRINT_POST_SOAK
    SAVE_GCODE_STATE NAME=PAUSE_STATE
  {% endif %}

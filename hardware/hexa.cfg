#####################################################################
#   FYSETC Hexa Distro Fusion: USB-to-CAN bridge (can0) + 6 tool ports
#####################################################################
# Firmware: STM32F072, no bootloader, 12 MHz crystal,
# "USB to CAN bus bridge (USB on PA11/PA12)", CAN bus on PB8/PB9,
# CAN speed = what EBB0's firmware uses (normally 1000000).
# The Hexa is also a Klipper MCU on can0. Find its UUID (and EBB0's) with
# Klipper stopped:
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
#
# CAN termination: the Hexa's built-in 120 ohm (JP1) is one end; keep the
# jumper on ONE toolhead only (EBB0). Powered off, CAN-H to CAN-L = ~60 ohm.
#
# Tool power ports P1-P6: leave their slide switches ON (always powered).
# A toolhead board on a Klipper-switched port is off when Klipper starts,
# so Klipper can't connect to it and won't start.

[mcu hexa]
canbus_uuid: 2da7abf20b8b

[temperature_sensor Hexa]
sensor_type: temperature_mcu
sensor_mcu: hexa

# --- Optional, uncomment what you use ------------------------------------
# Switched 24 V on a power port (switch OFF = Klipper controls it). Only for
# loads without their own MCU (lights, fans), not toolhead boards.
#[output_pin hexa_pwr_6]
#pin: hexa:PB11              # PWR1 PB14, PWR2 PB13, PWR3 PB12, PWR4 PB2, PWR5 PB10, PWR6 PB11
#value: 0
#shutdown_value: 0

# Thermistor on ADC1-4 (PA0-PA3), e.g. a chamber sensor
#[temperature_sensor chamber_hexa]
#sensor_type: Generic 3950
#sensor_pin: hexa:PA0
#min_temp: -20
#max_temp: 120

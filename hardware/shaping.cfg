#####################################################################
#   Input Shaping / Shake&Tune
#####################################################################
# Uses the ADXL345 on the T0 toolboard ([adxl345 T0] in toolchanger/tools/T0.cfg).
# Calibrate with: G28, then SHAPER_CALIBRATE (or Shake&Tune's AXES_SHAPER_CALIBRATION),
# then SAVE_CONFIG. [input_shaper] itself stays in printer.cfg so SAVE_CONFIG can write it.
# After shaping, max_accel in hardware/motion.cfg can usually go well above 3000 (see the
# recommended max accel in the SHAPER_CALIBRATE output).

[resonance_tester]
accel_chip: adxl345 T0
probe_points:
    150, 150, 20

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600

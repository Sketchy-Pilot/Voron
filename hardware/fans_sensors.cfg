#fan_speed: 1.0

#####################################################################
#   Chamber Temp
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950     # Most common 100k thermistor type
sensor_pin: PF4            # Change to your specific MCU pin
min_temp: 0
max_temp: 100
gcode_id: C                   # Allows it to show up on older LCD screens


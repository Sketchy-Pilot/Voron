# nfc2klipper updates in Fluidd's Software Updates (made by install_nfc2klipper.sh).
# After an update, re-run install_nfc2klipper.sh if tags stop reading on ttyAMA0
# (it re-applies the nfcpy baud-rate fix).
[update_manager nfc2klipper]
type: git_repo
channel: dev
path: ~/nfc2klipper
origin: https://github.com/bofh69/nfc2klipper.git
primary_branch: main
virtualenv: ~/nfc2klipper/venv
requirements: requirements.txt
managed_services: nfc2klipper
info_tags:
    desc=nfc2klipper
